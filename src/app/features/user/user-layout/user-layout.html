
<div class="min-h-screen bg-[#10110f] text-white">

  <!-- Mobile backdrop -->
  @if (sidebarOpen) {
    <button
      type="button"
      aria-label="Close navigation"
      class="fixed inset-0 z-40 bg-black/70 md:hidden"
      (click)="sidebarOpen = false">
    </button>
  }

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-50 flex w-64 flex-col
           border-r border-white/10 bg-[#10110f]
           transition-transform duration-200 md:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen">

    <a routerLink="/home"
       class="flex h-20 items-center gap-3 border-b border-white/10 px-6">
      <div class="flex h-10 w-10 items-center justify-center
                  rounded-xl bg-lime-400 text-xl font-black text-black">
        ♪
      </div>
      <span class="text-xl font-bold tracking-tight">
        Fresh<span class="text-lime-400">Music</span>
      </span>
    </a>

    <nav class="flex-1 space-y-2 px-4 py-6">
      <p class="mb-4 px-3 text-[10px] font-bold uppercase
                tracking-[0.2em] text-neutral-600">
        Your Music
      </p>

      <a routerLink="/home"
         routerLinkActive="bg-lime-400/10 text-lime-400"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="sidebarOpen = false"
         class="flex items-center gap-3 rounded-xl px-4 py-3
                text-sm text-neutral-400 transition hover:bg-white/5">
        <span class="text-lg">⌂</span>
        Home
      </a>
    </nav>

    <div class="border-t border-white/10 p-4">
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-3 rounded-xl px-4 py-3
               text-sm text-neutral-400 transition
               hover:bg-red-500/10 hover:text-red-400">
        <span class="text-lg">⇥</span>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="min-h-screen md:pl-64">
    <header class="sticky top-0 z-30 flex h-16 items-center
                   border-b border-white/10 bg-[#10110f]/90
                   px-5 backdrop-blur-xl md:px-8">
      <button
        type="button"
        class="mr-4 rounded-lg p-2 text-neutral-300 hover:bg-white/10 md:hidden"
        aria-label="Open navigation"
        (click)="sidebarOpen = !sidebarOpen">
        ☰
      </button>

      <span class="text-sm text-neutral-400">
        Your personal music space
      </span>
    </header>

    <main class="p-5 md:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
