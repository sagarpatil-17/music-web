<div
  class="fixed inset-x-0 bottom-0 z-40 border-t border-white/10
         bg-[#181818] px-4 py-3 md:px-6"
>
  <div class="mx-auto flex max-w-[1600px] items-center justify-between gap-3">
    <div class="flex min-w-0 items-center gap-3 md:w-1/4">
      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center
               rounded-xl bg-gradient-to-br from-indigo-500
               via-purple-500 to-pink-500 text-xl"
      >
        ♫
      </div>

      <div class="min-w-0">
        <p class="truncate text-sm font-semibold">Night Drive</p>
        <p class="truncate text-xs text-gray-400">Luna Waves</p>
      </div>

      <button aria-label="Like song" class="hidden text-gray-400 sm:block">
        ♡
      </button>
    </div>

    <div class="flex flex-1 flex-col items-center md:max-w-xl">
      <div class="flex items-center gap-5">
        <button aria-label="Shuffle" class="hidden text-gray-400 sm:block">⤨</button>
        <button aria-label="Previous track">|◀</button>

        <button
          aria-label="Play or pause"
          class="flex h-10 w-10 items-center justify-center
                 rounded-full bg-white text-black hover:scale-105"
        >
          ▶
        </button>

        <button aria-label="Next track">▶|</button>
        <button aria-label="Repeat" class="hidden text-gray-400 sm:block">↻</button>
      </div>

      <div class="mt-2 hidden w-full items-center gap-3 sm:flex">
        <span class="text-[10px] text-gray-500">1:24</span>
        <div class="h-1 flex-1 overflow-hidden rounded-full bg-white/15">
          <div class="h-full w-[36%] rounded-full bg-cyan-400"></div>
        </div>
        <span class="text-[10px] text-gray-500">3:48</span>
      </div>
    </div>

    <div class="hidden items-center justify-end gap-3 md:flex md:w-1/4">
      <span class="text-gray-400">▤</span>
      <span class="text-gray-400">🔊</span>
      <div class="h-1 w-24 rounded-full bg-white/15">
        <div class="h-1 w-2/3 rounded-full bg-cyan-400"></div>
      </div>
    </div>
  </div>
</div>
